; Fallback queue workers independientes de Horizon.
; Útil si Horizon está deshabilitado o para colas de baja prioridad.
; En producción con Horizon activo este programa puede estar STOPPED.
[program:jobshours-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/jobshour-api/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=120
numprocs=2
autostart=false
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/jobshours-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
