# Logrotate para JobsHours
# Copiar a /etc/logrotate.d/jobshours
# sudo cp /var/www/jobshour-api/deploy/logrotate.conf /etc/logrotate.d/jobshours

/var/log/jobshours-*.log
/var/log/pm2/jobshour-*.log
/var/www/jobshour-api/storage/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        supervisorctl signal USR2 jobshours-horizon 2>/dev/null || true
        supervisorctl signal USR2 jobshours-reverb  2>/dev/null || true
        pm2 reloadLogs 2>/dev/null || true
    endscript
}
