[program:jobshours-horizon]
process_name=%(program_name)s
command=php /var/www/jobshour-api/artisan horizon
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/jobshours-horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
startsecs=5
startretries=3
