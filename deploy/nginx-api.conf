# Nginx config para jobshours.com – API Laravel + WebSocket Reverb
# Copiar a /etc/nginx/sites-available/jobshours-api y symlink a sites-enabled/
# sudo ln -s /etc/nginx/sites-available/jobshours-api /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name jobshours.com www.jobshours.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jobshours.com www.jobshours.com;

    # Certificados TLS (Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/jobshours.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobshours.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/jobshour-api/public;
    index index.php;

    # Logs
    access_log /var/log/nginx/jobshours-api-access.log;
    error_log  /var/log/nginx/jobshours-api-error.log;

    # Tamaño máximo de uploads (CV, imágenes)
    client_max_body_size 20M;

    # ─── WebSocket Reverb ──────────────────────────────────────────────────────
    # Reverb escucha en 127.0.0.1:8080 (gestionado por Supervisor).
    # El frontend conecta a wss://jobshours.com/app/{key}
    location /app/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Reverb /apps/ endpoint (autenticación de canales privados)
    location /apps/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    # ──────────────────────────────────────────────────────────────────────────

    # API Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   unix:/run/php/php8.2-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
